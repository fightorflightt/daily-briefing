<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公众号夜读</title>
  <meta name="description" content="每天23:00更新的公众号文章目录，按日期阅读并直达原文。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">

    <section id="content" class="content"><p class="loading">正在打开今晚的版面…</p></section>
    <footer><span>ARCHIVE / 每日留档</span><a href="https://github.com/fightorflightt/daily-briefing" rel="noreferrer">GitHub 仓库 ↗</a></footer>

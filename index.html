<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公众号资讯</title>
  <meta name="description" content="每天23:00更新的公众号文章目录，按日期阅读并直达原文。">
  <link rel="stylesheet" href="style.css?v=20261025-simple">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>公众号资讯</h1>
      <nav id="dates" aria-label="日期（最新在上）"></nav>
    </aside>
    <main class="main">
      <header class="toolbar">
        <h2 id="issue-date">加载中…</h2>
        <input id="search" type="search" aria-label="搜索文章" placeholder="搜索标题或公众号">
      </header>
      <section id="content" aria-label="文章列表" aria-busy="true"><p class="message" role="status">正在加载文章…</p></section>
    </main>
  </div>
  <script src="app.js?v=20261025-simple"></script>
</body></html>
